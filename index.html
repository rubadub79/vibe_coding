<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숭문 선생님들을 위한 앱 모음</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sungmoon: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#1d4ed8',
              600: '#1e40af',
              700: '#1e3a8a',
              800: '#172554',
            },
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .app-card {
      transition: all 0.2s ease-in-out;
    }
    .app-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -4px rgba(30, 64, 175, 0.1);
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-sungmoon-100 selection:text-sungmoon-700">

  <!-- Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo & Main Title -->
      <div class="flex items-center space-x-3 text-left">
        <div class="w-10 h-10 rounded-xl bg-sungmoon-600 flex items-center justify-center text-white shadow">
          <i class="fa-solid fa-graduation-cap text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight tracking-tight text-slate-100">
            숭문 선생님들을 위한 앱 모음
          </h1>
        </div>
      </div>

      <!-- Badge -->
      <div class="flex items-center space-x-3">
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-sungmoon-800 text-sungmoon-200 border border-sungmoon-700">
          <i class="fa-solid fa-school text-xs mr-1.5"></i> Soongmoon App Hub
        </span>
      </div>

    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col space-y-8">
    
    <!-- Hero Banner -->
    <div class="relative overflow-hidden rounded-2xl bg-slate-800 p-6 sm:p-8 text-white shadow-md border border-slate-700">
      <div class="relative z-10 max-w-3xl">
        <h2 class="text-xl sm:text-2xl font-bold tracking-tight text-white mb-2">
          업무 & 연수 도구 모음
        </h2>
        <p class="text-slate-300 text-xs sm:text-sm leading-relaxed mb-6">
          선생님들의 업무와 연수 활동에 필요한 도구를 모아둔 곳입니다. 파일은 서버에 저장되지 않고 웹 브라우저에서 안전하게 처리됩니다.
        </p>

        <!-- Search Bar & Category Filter Buttons -->
        <div class="flex flex-col sm:flex-row items-stretch gap-3">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <input type="text" id="hub-search-input" placeholder="원하는 앱 또는 연수 자료를 검색하세요..." class="w-full pl-9 pr-4 py-2.5 text-xs sm:text-sm rounded-xl bg-slate-900/90 text-slate-100 placeholder-slate-400 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>
          <div class="flex items-center space-x-2">
            <button class="category-filter-btn px-4 py-2.5 text-xs font-medium rounded-xl bg-white text-slate-900 shadow transition-colors" data-category="all">
              전체
            </button>
            <button class="category-filter-btn px-4 py-2.5 text-xs font-medium rounded-xl bg-slate-700/60 hover:bg-slate-700 text-slate-200 transition-colors" data-category="utility">
              유틸리티
            </button>
            <button class="category-filter-btn px-4 py-2.5 text-xs font-medium rounded-xl bg-slate-700/60 hover:bg-slate-700 text-slate-200 transition-colors" data-category="classtools">
              수업 도구
            </button>
            <button class="category-filter-btn px-4 py-2.5 text-xs font-medium rounded-xl bg-slate-700/60 hover:bg-slate-700 text-slate-200 transition-colors" data-category="edu">
              수업 자료
            </button>
            <button class="category-filter-btn px-4 py-2.5 text-xs font-medium rounded-xl bg-slate-700/60 hover:bg-slate-700 text-slate-200 transition-colors" data-category="training">
              연수 자료
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Category: Utility -->
    <section class="category-section" data-section="utility">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
          <div class="w-7 h-7 rounded-lg bg-blue-100 text-brand-600 flex items-center justify-center font-bold text-xs">
            <i class="fa-solid fa-wrench"></i>
          </div>
          <h3 class="text-lg font-bold text-slate-900">유틸리티</h3>
        </div>
      </div>

      <div id="grid-utility" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Category: Class Tools -->
    <section class="category-section" data-section="classtools">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
          <div class="w-7 h-7 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center font-bold text-xs">
            <i class="fa-solid fa-chalkboard-user"></i>
          </div>
          <h3 class="text-lg font-bold text-slate-900">수업 도구</h3>
        </div>
      </div>

      <div id="grid-classtools" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Category: Education Materials -->
    <section class="category-section" data-section="edu">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
          <div class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-xs">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <h3 class="text-lg font-bold text-slate-900">수업 자료</h3>
        </div>
      </div>

      <div id="grid-edu" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Category: Training -->
    <section class="category-section" data-section="training">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
          <div class="w-7 h-7 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xs">
            <i class="fa-solid fa-book-open"></i>
          </div>
          <h3 class="text-lg font-bold text-slate-900">연수자료</h3>
        </div>
      </div>

      <div id="grid-training" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Rendered dynamically -->
      </div>
    </section>

  </main>

  <script>
    /* 
      ==================================================================
      📌 [관리자용 앱/자료 목록 설정]
      새로운 유틸리티 앱이나 연수자료를 추가하려면 아래 배열에 항목을 추가하세요.
      ==================================================================
    */
    const REGISTERED_APPS = [
      {
        category: 'utility',
        title: 'PDF 자르기',
        desc: 'PDF 문서에서 필요한 페이지만 선택해서 새 PDF 파일로 추출 및 저장합니다.',
        url: './pdfcutter/index.html',
        icon: 'fa-scissors'
      },
      {
        category: 'utility',
        title: 'PDF 붙이기',
        desc: '여러 PDF 파일의 순서를 조정하여 하나의 PDF 문서로 병합 및 저장합니다.',
        url: './pdfmerger/index.html',
        icon: 'fa-file-circle-plus'
      },
      {
        category: 'classtools',
        title: '학급 발표·메모장',
        desc: '화면에 발표 자료를 띄우고 수업 중 메모나 공지를 함께 남길 수 있는 수업용 도구입니다.',
        url: 'https://script.google.com/macros/s/AKfycbyH_i7H_6stMhCbgMBwXDJJNeCm8gr79S51lPLvCGr71cW_zHIQTvXdVranuBCIajwYLQ/exec',
        icon: 'fa-chalkboard-user'
      },
      {
        category: 'training',
        title: '원클릭 웹앱 프롬프트 생성기',
        desc: '원하는 조건만 입력하면 상황에 맞는 AI 프롬프트를 바로 만들어주는 연수용 도구입니다.',
        url: './one_click_prompt/index.html',
        icon: 'fa-wand-magic-sparkles'
      },
      {
        category: 'training',
        title: '5단계 웹앱 프롬프트 생성기',
        desc: '다섯 단계를 따라가며 좋은 프롬프트를 만드는 방법을 익히는 연수용 도구입니다.',
        url: './5steps_prompt/index.html',
        icon: 'fa-list-ol'
      },
      {
        category: 'edu',
        title: '서울의 달',
        desc: '서울 위경도 기준으로 실시간 달의 위상과 남중 고도, 출몰 시각을 관측할 수 있는 교육용 시뮬레이터입니다.',
        url: './seoul_moon/index.html',
        icon: 'fa-moon'
      },
      {
        category: 'edu',
        title: '환율의 고수',
        desc: '환율 개념과 변동을 직접 체험하며 익힐 수 있는 교육용 시뮬레이터입니다.',
        url: './exchange_rate/index.html',
        icon: 'fa-coins'
      }
    ];

    let currentCategory = 'all';
    let searchQuery = '';

    const gridUtility = document.getElementById('grid-utility');
    const gridTraining = document.getElementById('grid-training');
    const gridClasstools = document.getElementById('grid-classtools');
    const gridEdu = document.getElementById('grid-edu');
    const searchInput = document.getElementById('hub-search-input');
    const filterBtns = document.querySelectorAll('.category-filter-btn');
    const categorySections = document.querySelectorAll('.category-section');

    function createCardHTML(app) {
      const categoryLabel = app.category === 'utility' ? '유틸리티' : (app.category === 'classtools' ? '수업 도구' : (app.category === 'edu' ? '수업 자료' : '연수자료'));
      const iconClass = app.icon || (app.category === 'utility' ? 'fa-wrench' : 'fa-book');

      return `
        <div class="app-card bg-white rounded-2xl border border-slate-200 p-5 flex flex-col justify-between shadow-sm hover:border-brand-300 relative group">
          <div>
            <div class="flex items-start justify-between mb-3">
              <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center shadow-sm">
                <i class="fa-solid ${iconClass} text-lg"></i>
              </div>
              <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-slate-100 text-slate-600">
                ${categoryLabel}
              </span>
            </div>

            <h4 class="text-base font-bold text-slate-900 mb-1">${app.title}</h4>
            <p class="text-xs text-slate-500 leading-relaxed mb-4">
              ${app.desc}
            </p>
          </div>

          <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
            <span class="text-[11px] text-slate-400">바로가기</span>
            <a href="${app.url}" class="px-3.5 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium rounded-lg shadow-sm transition-all flex items-center space-x-1.5">
              <span>실행하기</span>
              <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </a>
          </div>
        </div>
      `;
    }

    function renderApps() {
      const filtered = REGISTERED_APPS.filter(app => {
        const matchesCategory = currentCategory === 'all' || app.category === currentCategory;
        const matchesSearch = searchQuery === '' || 
          app.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
          app.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const utilities = filtered.filter(app => app.category === 'utility');
      const trainings = filtered.filter(app => app.category === 'training');
      const classtools = filtered.filter(app => app.category === 'classtools');
      const edus = filtered.filter(app => app.category === 'edu');

      // Utility section rendering
      if (utilities.length > 0) {
        gridUtility.innerHTML = utilities.map(createCardHTML).join('');
      } else {
        gridUtility.innerHTML = `
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 flex flex-col items-center justify-center text-center col-span-full">
            <p class="text-xs text-slate-500">등록된 유틸리티가 없습니다.</p>
          </div>
        `;
      }

      // Training section rendering
      if (trainings.length > 0) {
        gridTraining.innerHTML = trainings.map(createCardHTML).join('');
      } else {
        gridTraining.innerHTML = `
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 flex flex-col items-center justify-center text-center col-span-full sm:col-span-1">
            <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mb-3">
              <i class="fa-solid fa-file-code text-lg"></i>
            </div>
            <h4 class="font-bold text-slate-800 text-sm mb-1">연수 자료 등록 예정</h4>
            <p class="text-xs text-slate-500 max-w-xs mb-3">
              등록된 연수 자료가 없습니다.
            </p>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-[11px] font-medium bg-slate-200 text-slate-600">
              준비 중
            </span>
          </div>
        `;
      }

      // Class tools section rendering
      if (classtools.length > 0) {
        gridClasstools.innerHTML = classtools.map(createCardHTML).join('');
      } else {
        gridClasstools.innerHTML = `
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 flex flex-col items-center justify-center text-center col-span-full">
            <p class="text-xs text-slate-500">등록된 수업 도구가 없습니다.</p>
          </div>
        `;
      }

      // Education materials section rendering
      if (edus.length > 0) {
        gridEdu.innerHTML = edus.map(createCardHTML).join('');
      } else {
        gridEdu.innerHTML = `
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 flex flex-col items-center justify-center text-center col-span-full">
            <p class="text-xs text-slate-500">등록된 수업 자료가 없습니다.</p>
          </div>
        `;
      }

      // Category section visibility
      categorySections.forEach(section => {
        const secCat = section.dataset.section;
        if (currentCategory === 'all' || currentCategory === secCat) {
          section.classList.remove('hidden');
        } else {
          section.classList.add('hidden');
        }
      });
    }

    // Search input listener
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderApps();
    });

    // Category button listeners
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => {
          b.classList.remove('bg-white', 'text-slate-900', 'shadow');
          b.classList.add('bg-slate-700/60', 'text-slate-200');
        });
        btn.classList.remove('bg-slate-700/60', 'text-slate-200');
        btn.classList.add('bg-white', 'text-slate-900', 'shadow');

        currentCategory = btn.dataset.category;
        renderApps();
      });
    });

    // Initial render
    document.addEventListener('DOMContentLoaded', renderApps);
  </script>
</body>
</html>
